name: Auto Update IPTV Channels

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pycountry

      - name: Run Python Script
        run: python update_m3u.py

      # 🌟 ဖြေရှင်းချက် - Git ကို လက်နဲ့ မရေးတော့ဘဲ အလိုအလျောက် သေချာပေါက် Save ပေးမယ့် ပလပ်ဂင် (Plugin) ကို ပြောင်းသုံးလိုက်ပါပြီ
      - name: Auto Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update active channels"
          file_pattern: "active_m3u/*.m3u"
