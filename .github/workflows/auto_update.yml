# SAHARA IPTV - automated playlist refresh
# Runs at 00:17 UTC on calendar days 1, 11 and 21 each month.

name: SAHARA IPTV Auto Update

on:
  schedule:
    - cron: '17 0 1,11,21 * *'

  workflow_dispatch:
    inputs:
      skip_link_check:
        description: 'Skip HTTP stream checks for a faster run'
        required: false
        type: boolean
        default: false
      workers:
        description: 'Concurrent link-check workers'
        required: false
        type: choice
        options:
          - '32'
          - '40'
          - '64'
          - '96'
        default: '64'

permissions:
  contents: read

concurrency:
  group: sahara-iptv-auto-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-channels:
    name: Collect, validate and publish playlists
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and verify dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install requests pycountry
          fi

      - name: Detect updater script
        id: detect-script
        run: |
          set -Eeuo pipefail
          if [[ -f update_m3u.py ]]; then
            SCRIPT_PATH='update_m3u.py'
          elif [[ -f sahara_iptv_builder_v3.py ]]; then
            SCRIPT_PATH='sahara_iptv_builder_v3.py'
          else
            echo '::error::No supported updater found in the repository root.'
            exit 1
          fi
          printf 'path=%s\n' "$SCRIPT_PATH" >> "$GITHUB_OUTPUT"

      - name: Compile-check updater
        env:
          SCRIPT_PATH: ${{ steps.detect-script.outputs.path }}
        run: |
          set -Eeuo pipefail
          python -m py_compile "$SCRIPT_PATH"

      - name: Run IPTV updater
        id: run-updater
        timeout-minutes: 75
        env:
          SCRIPT_PATH: ${{ steps.detect-script.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
          IPTV_WORKERS: ${{ inputs.workers || '64' }}
          IPTV_TIMEOUT: '5'
          SKIP_LINK_CHECK: ${{ inputs.skip_link_check && 'true' || 'false' }}
        run: |
          set -Eeuo pipefail
          args=(--workers "$IPTV_WORKERS" --timeout "$IPTV_TIMEOUT" --output active_m3u)
          if [[ "$SKIP_LINK_CHECK" == 'true' ]]; then
            args+=(--skip-link-check)
          fi
          python -u "$SCRIPT_PATH" "${args[@]}"

      - name: Validate generated playlists
        id: validate
        env:
          SCRIPT_PATH: ${{ steps.detect-script.outputs.path }}
          SKIP_LINK_CHECK: ${{ inputs.skip_link_check && 'true' || 'false' }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path("active_m3u")
          if not root.is_dir():
              sys.exit("ERROR: updater did not create the active_m3u directory")

          playlists = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path.suffix.lower() == ".m3u"
          )
          if not playlists:
              sys.exit("ERROR: no .m3u playlists were generated")

          total_streams = 0
          total_bytes = 0
          stream_pattern = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*://\S+$")

          for playlist in playlists:
              content = playlist.read_text(encoding="utf-8-sig", errors="replace")
              lines = [line.strip() for line in content.splitlines() if line.strip()]
              stream_lines = [
                  line for line in lines
                  if not line.startswith("#") and stream_pattern.match(line)
              ]
              total_streams += len(stream_lines)
              total_bytes += playlist.stat().st_size

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"playlist_count={len(playlists)}\n")
              output.write(f"stream_count={total_streams}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## SAHARA IPTV update summary\n\n")
              summary.write(f"- Generated playlists: **{len(playlists)}**\n")
              summary.write(f"- Validated stream entries: **{total_streams:,}**\n")
              summary.write(f"- Playlist data size: **{total_bytes:,} bytes**\n")
          PY

      - name: Commit and push changed playlists
        id: auto-commit
        env:
          TARGET_REF_TYPE: ${{ github.ref_type }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          GENERATED_DIR="$RUNNER_TEMP/sahara-active-m3u-generated"
          rm -rf "$GENERATED_DIR"
          mkdir -p "$GENERATED_DIR"
          cp -a active_m3u/. "$GENERATED_DIR/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            git reset --hard "refs/remotes/origin/${TARGET_BRANCH}"

            rm -rf active_m3u
            mkdir -p active_m3u
            cp -a "$GENERATED_DIR"/. active_m3u/

            git add --all -- active_m3u/

            if git diff --cached --quiet; then
              echo 'No playlist changes detected; nothing to commit.'
              echo 'changes_detected=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "chore(iptv): refresh active playlists"

            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              COMMIT_HASH="$(git rev-parse --short HEAD)"
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
