name: Auto Update IPTV Channels

on:
  schedule:
    - cron: '0 0 * * *' # နေ့စဉ် ည ၁၂ နာရီတိုင်း အလိုအလျောက် Run မည်
  workflow_dispatch: # ကိုယ်တိုင် Click နှိပ်ပြီး Run ခွင့်ပေးမည်

# 🌟 ဖြေရှင်းချက် - Bot ကို ဖိုင်ပြန် Save (Write) ခွင့် အတိအလင်း ပေးလိုက်ပါသည်
permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pycountry

      - name: Run Python Script
        run: python update_m3u.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Sahara Bot"
          git config --global user.email "bot@sahara.com"
          git add active_m3u/
          git commit -m "Auto-update active channels" || echo "No changes to commit"
          git push
